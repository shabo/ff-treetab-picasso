# Sign a self-distributed (unlisted) build on AMO and attach the signed .xpi
# to the GitHub Release of the current version. Use it when the listed version
# waits for review.
#
# This workflow replaces the GitHub Actions workflow sign-unlisted.yml.
# Manual run only: set AMO_TASK=sign-unlisted and BUILD=<1..9999>.
# The unlisted version is <manifest version>.<BUILD>, for example 0.2.0.1. It
# never collides with a listed version. The next listed release (for example
# 0.2.1) is higher and updates it.
#
# The workflow has four steps:
#   prepare        Install the dependencies. Make the build directory and set
#                  the unlisted version. This step has no secret.
#   check-release  Make sure that the GitHub Release exists. This step has the
#                  GitHub token only.
#   sign           Sign the package on AMO. This step has the AMO secrets only.
#   attach         Upload the signed .xpi to the GitHub Release. This step has
#                  the GitHub token only.
# The split keeps each secret in one step. The step that runs npm ci never
# sees a secret.
#
# The workflow writes to AMO and to GitHub on branch main only.
#
# Secrets: amo_jwt_issuer, amo_jwt_secret, ff_treetab_release_token.

labels:
  platform: linux/amd64

when:
  - event: manual
    branch: main
    evaluate: 'AMO_TASK == "sign-unlisted"'

depends_on: [ci]

steps:
  - name: prepare
    image: node:24.22.3-bookworm@sha256:9d266751ca3d7fdbe651c878ffd5ad0a42fed49a18c283509267c97f025b7496
    environment:
      NO_UPDATE_NOTIFIER: '1'
    commands:
      - npm ci
      - |
        bash -euo pipefail <<'SH'
        build="$${BUILD:-}"
        if ! [[ "$$build" =~ ^[1-9][0-9]{0,3}$$ ]]; then
          echo "ERROR: BUILD must be an integer 1-9999, got '$$build'" >&2
          exit 1
        fi
        base="$$(node -p "JSON.parse(require('fs').readFileSync('src/manifest.json','utf8')).version")"
        version="$${base}.$${build}"
        rm -rf build/unlisted && mkdir -p build && cp -r src build/unlisted
        node -e '
          const fs = require("fs");
          const p = "build/unlisted/manifest.json";
          const m = JSON.parse(fs.readFileSync(p, "utf8"));
          m.version = process.argv[1];
          fs.writeFileSync(p, JSON.stringify(m, null, 2) + "\n");
        ' "$$version"
        printf '%s\n' "$$base" > .unlisted-base
        printf '%s\n' "$$version" > .unlisted-version
        SH

  - name: check-release
    image: node:24.22.3-bookworm@sha256:9d266751ca3d7fdbe651c878ffd5ad0a42fed49a18c283509267c97f025b7496
    environment:
      NO_UPDATE_NOTIFIER: '1'
      GH_TOKEN:
        from_secret: ff_treetab_release_token
    commands:
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends gh >/dev/null
      - |
        bash -euo pipefail <<'SH'
        base="$$(cat .unlisted-base)"
        gh release view "v$${base}" --repo shabo/ff-treetab-picasso >/dev/null \
          || { echo "ERROR: Release v$${base} does not exist" >&2; exit 1; }
        SH

  - name: sign
    image: node:24.22.3-bookworm@sha256:9d266751ca3d7fdbe651c878ffd5ad0a42fed49a18c283509267c97f025b7496
    environment:
      NO_UPDATE_NOTIFIER: '1'
      WEB_EXT_API_KEY:
        from_secret: amo_jwt_issuer
      WEB_EXT_API_SECRET:
        from_secret: amo_jwt_secret
    commands:
      - |
        bash -euo pipefail <<'SH'
        if [ "$${CI_COMMIT_BRANCH:-}" != "main" ]; then
          echo "ERROR: This step runs on branch main only." >&2
          exit 1
        fi
        npx web-ext sign \
          --source-dir build/unlisted \
          --artifacts-dir dist \
          --channel unlisted \
          --approval-timeout 1800000
        SH

  - name: attach
    image: node:24.22.3-bookworm@sha256:9d266751ca3d7fdbe651c878ffd5ad0a42fed49a18c283509267c97f025b7496
    environment:
      NO_UPDATE_NOTIFIER: '1'
      GH_TOKEN:
        from_secret: ff_treetab_release_token
    commands:
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends gh >/dev/null
      - |
        bash -euo pipefail <<'SH'
        if [ "$${CI_COMMIT_BRANCH:-}" != "main" ]; then
          echo "ERROR: This step runs on branch main only." >&2
          exit 1
        fi
        base="$$(cat .unlisted-base)"
        version="$$(cat .unlisted-version)"
        gh release view "v$${base}" --repo shabo/ff-treetab-picasso >/dev/null \
          || { echo "ERROR: Release v$${base} does not exist" >&2; exit 1; }
        shopt -s nullglob
        xpis=(dist/*.xpi)
        if [ "$${#xpis[@]}" -ne 1 ]; then
          echo "ERROR: Expected one signed .xpi, found $${#xpis[@]}" >&2
          exit 1
        fi
        out="dist/tree_tab_picasso-$${version}-signed.xpi"
        mv "$${xpis[0]}" "$$out"
        gh release upload "v$${base}" "$$out" --repo shabo/ff-treetab-picasso --clobber
        echo "Attached $$(basename "$$out") to v$${base}"
        SH
